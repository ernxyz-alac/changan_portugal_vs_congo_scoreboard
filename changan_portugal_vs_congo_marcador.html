<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <style>
        body {
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }

        #content-iframe {
            object-fit: fill;
            position: absolute;
            right: 0px;
            left: 0px;
            top: 0px;
            bottom: 0px;
            min-width: 100%;
            min-height: 100%;
            width: 100%;
            height: 100vh;
            z-index: -100;
            background-size: cover;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- next time if there's lotta trouble with the res, hardcode that shi -->
    <!-- Update these width/height values to match your billboard screen -->
    <iframe id="content-iframe" src="./index.html" width="100%"
        frameborder="0"></iframe>

    <script>
        // Update these values to match your billboard screen
        var targetWidth = window.screen.width;
        var targetHeight = window.screen.height;
        var isPortrait = targetHeight > targetWidth;

        // Force the local index.html and pass the screen dimensions
        var baseUrl = "./index.html";
        var query = "?width=" + targetWidth + "&height=" + targetHeight + (isPortrait ? "&v=1" : "");
        
        document.getElementById('content-iframe').src = baseUrl + query;
    </script>
</body>

</html>
